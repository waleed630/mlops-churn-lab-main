# Full ML pipeline: test -> train -> quality gate -> deploy (HF, then Azure)
name: ML Pipeline

on:
  push:
    branches: [main, lab3, lab4]
  workflow_dispatch:

jobs:
  # ---------------- JOB 1: train, test, gate ----------------
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (cleaning code)
        run: pytest -q tests/test_prepare.py

      - name: Run DVC pipeline
        run: dvc repro

      - name: Quality gate
        run: python -m src.check_gate

      - name: API tests (uses the model just trained)
        run: pytest -q tests/test_api.py

      - name: Build release folder
        run: bash scripts/build_release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/

  # ---------------- JOB 2: deploy to Hugging Face ----------------
  deploy-hf:
    needs: train
    runs-on: ubuntu-latest
    if: vars.HF_SPACE != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release/

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install huggingface_hub==0.26.2
          python scripts/deploy_hf.py

  # ---------------- JOB 3: push image to Azure (Session 4) ----------------
  # (Session 4: paste the deploy-azure job here - see Lab 4, Step 8)
